<!DOCTYPE html>
<html lang="en">

    {% block head %}
        {% include './elements/HTML_Head.html' %}
    {% endblock %}

<body>

    {% block app_header %}
        {% include './elements/Header_General.html' %}
    {% endblock %}

    <main id="host">
        <div id="sidebar">
            <ul>
                <li class="active">Introduction</li>
                <li class="inactive">Demo</li>
            </ul>
        </div>
        <div id="content">
            <div id="conversation">
            </div><br>
            <div class="chat-box">
                <form id="input" onsubmit="AskQuestion();return false;" method="post">
                    <input id="question" name="question" type="text" required placeholder="What's your question?"/>
                </form>
            </div>
        </div>
    </main>

</body>

</html>
