{% for class in context.user.courses %}
<div class="col">
    <div class="card">
        <img src="{{ class.image_path }}" class="card-img-top" alt="Course Splash Image">
        <div class="card-body flex-column">
            <div class="d-flex">
                <h5 class="card-title">{{ class.display_name }}</h5>
                <p class="ms-auto card-text"><small class="text-body-secondary">CS 232-01</small></p>
            </div>
            <div class="d-flex align-items-center flex-row justify-content-between w-100">
                <a href="/dashboard/class?course_id={{ class.id }}" class="btn btn-outline-primary rounded-pill">View Class</a>
                <a href="/chat/{{ class.id }}" class="btn btn-outline-secondary rounded-pill">Chat with the TA</a>
            </div>
        </div>
    </div>
</div>
{% endfor %}
